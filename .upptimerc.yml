# Upptime (https://upptime.js.org) for RTFM License Manager. Checks run from GitHub, outside Cloudflare and Google.
owner: jansenkarl
repo: rtfm-status
user-agent: rtfm-status

sites:
  - name: Licensing API
    url: https://license-api.rtfmdesign.com/health
  - name: Product verification keys
    url: https://license-api.rtfmdesign.com/v1/products/rtfm-player/verification-keys
  - name: License Manager
    url: https://lm.rtfmdesign.com/
  - name: Customer self-service
    url: https://lm.rtfmdesign.com/deactivate/rtfm-player

# Downtime issues are assigned to the owner, so GitHub emails them (no SMTP secrets needed).
assignees:
  - jansenkarl

status-website:
  cname: status.rtfmdesign.com
  # RTFM's dark palette and fonts (assets/rtfm-theme.css), in place of Upptime's teal light and dark themes.
  themeUrl: https://status.rtfmdesign.com/rtfm-theme.css
  logoUrl: https://raw.githubusercontent.com/jansenkarl/rtfm-status/master/assets/logo.svg
  name: RTFM License Manager status
  introTitle: "RTFM License Manager status"
  introMessage: >-
    Live checks of the licensing service, every few minutes, from outside RTFM's hosting. Apps that are already
    activated keep working through an outage: they renew their licenses only every few weeks and carry signed
    offline leases.
  # Drops the emoji Upptime puts before the summary line; rtfm-theme.css draws a colored dot instead.
  js: >-
    new MutationObserver(function () { document.querySelectorAll('article:not(.graph)').forEach(function (a) {
    var t = a.firstChild; if (t && t.nodeType === 3 && /^[^\sA-Za-z]+[\s\u00a0]+/.test(t.textContent))
    t.textContent = t.textContent.replace(/^[^\sA-Za-z]+[\s\u00a0]+/, ''); }); })
    .observe(document.documentElement, { childList: true, subtree: true, characterData: true });
  navbar:
    - title: Status
      href: /
    - title: RTFM License Manager
      href: https://lm.rtfmdesign.com
    - title: Support
      href: https://rtfmdesign.com/support/
